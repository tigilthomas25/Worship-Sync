<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#641536"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="WorshipSync"/>
  <title>WorshipSync • Holy Rosary English Choir</title>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>
  <link rel="stylesheet" href="./style.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="brandrow">
      <div class="logo">WS</div>
      <div>
        <div class="eyebrow">HOLY ROSARY ENGLISH CHOIR</div>
        <h1>WorshipSync</h1>
        <div class="tagline">Sing • Play • Worship — Together</div>
      </div>
    </div>
    <label class="search"><span>⌕</span><input id="search" placeholder="Search songs, key or style…"/></label>
  </div>
</header>

<main class="wrap">
  <nav class="tabs">
    <button class="tab active" data-tab="songs">Songs</button>
    <button class="tab" data-tab="setlist">Sunday Setlist</button>
    <button class="tab" data-tab="favs">♡ Favourites</button>
  </nav>
  <section id="homeView">
    <div class="sectionhead"><h2 id="listTitle">Song Library</h2><span id="songCount"></span></div>
    <div id="songList" class="songlist"></div>
  </section>

  <section id="songView" class="hidden">
    <button id="backBtn" class="back">← Back to songs</button>
    <article class="songpage">
      <div class="songtop">
        <div><div class="eyebrow dark">WORSHIPSYNC SONG</div><h2 id="songTitle"></h2></div>
        <button id="favBtn" class="iconbtn" title="Favourite">♡</button>
      </div>
      <div id="meta" class="meta"></div>

      <div class="modebar">
        <button class="mode active" data-mode="singer">🎤 Singer</button>
        <button class="mode" data-mode="guitar">🎸 Guitar</button>
        <button class="mode" data-mode="piano">🎹 Piano</button>
      </div>

      <div class="tools">
        <div class="transpose"><button id="minus">−</button><span>Transpose <b id="transposeVal">0</b></span><button id="plus">+</button></div>
        <div class="fontsize"><button id="smaller">A−</button><button id="larger">A+</button></div>
      </div>

      <div class="legend">
        <span class="cue soft">SOFT</span><span class="cue build">BUILD</span>
        <span class="cue loud">LOUD</span><span class="cue solo">SOLO</span>
        <span class="cue group">MEN / WOMEN / ALL</span>
      </div>

      <div id="chordPanel" class="chordpanel hidden"></div>
      <div id="lyrics" class="lyrics"></div>
    </article>
  </section>

<section id="adminView" class="hidden">
  <h2>Admin - Add Song</h2>
  <p>Add and manage choir songs here.</p>

  <form id="addSongForm">
    <label for="newTitle">Song Title</label>
    <input id="newTitle" type="text"
           placeholder="Amazing Grace" required>

    <label for="newArtist">Artist / Composer</label>
    <input id="newArtist" type="text"
           placeholder="John Newton">

    <label for="newKey">Song Key</label>
    <input id="newKey" type="text"
           placeholder="G">

    <label for="newTempo">Tempo (BPM)</label>
    <input id="newTempo" type="number"
           placeholder="72">

    <label for="newTime">Time Signature</label>
    <input id="newTime" type="text"
           placeholder="4/4">

    <label for="newStyle">Style / Category</label>
    <input id="newStyle" type="text"
           placeholder="Worship, Gentle">

    <label for="newCapo">Capo</label>
    <input id="newCapo" type="text"
           placeholder="-">

    <label for="newLyrics">Lyrics and Chords</label>
    <textarea id="newLyrics" rows="8"
      placeholder="Enter lyrics and chords here"></textarea>

    <button type="submit">Save Song</button>
  </form>
</section>

</main>

<footer>WorshipSync • Holy Rosary English Choir <span id="offlineState">• Online</span></footer>
<script src="./app.js"></script>
</body>
</html>
